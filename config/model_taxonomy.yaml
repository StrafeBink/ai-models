recommendation_thresholds:
  download_now_score: 70
  watch_score: 45
  archive_score: 75

release_radar:
  daily:
    purpose: Major/high-confidence release alerts only.
    max_items: 10
  weekly:
    purpose: Full category digest with Download Now, Watch, Archive, Ignore outcomes.
    max_items_per_category: 8
  monthly:
    purpose: Installed library review for replacements, archive candidates, cleanup, and missing coverage.
